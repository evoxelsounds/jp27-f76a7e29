<style>
:root{--g:#173f38;--r:#c85a44;--bg:#f7f3eb;--mut:#64716a;--line:#e3ddd1;--blue:#24507a;--card:#fff}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--g)}
#app{display:flex;height:100%}
#side{width:400px;max-width:44vw;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#map{flex:1;min-width:0}
header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--g);color:#fff}
header h1{margin:0;font-size:19px}header p{margin:3px 0 0;font-size:12px;opacity:.85}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;background:#faf8f3;padding:9px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
#tabs button.on{background:#fff;color:var(--r);box-shadow:inset 0 -3px 0 var(--r)}
#days{display:flex;gap:5px;padding:9px 12px;border-bottom:1px solid var(--line);background:#faf8f3;overflow-x:auto;flex:0 0 auto}
#days button{flex:0 0 auto;border:1px solid #d9d3c5;background:#fff;border-radius:14px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--g)}
#days button.tr{border-color:var(--blue);color:var(--blue)}
#days button.on{background:var(--r);border-color:var(--r);color:#fff}
#scroll{overflow:auto;flex:1;min-height:0}
#info,#hinfo{padding:10px 14px 20px}
.dayh{font-size:17px;font-weight:800;margin:0 0 2px}.daym{font-size:12px;color:var(--mut);margin-bottom:8px}
.tb{display:inline-block;background:var(--blue);color:#fff;font-size:11px;border-radius:10px;padding:2px 8px;margin-inline-start:6px;vertical-align:middle}
.st{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:9px;cursor:pointer;transition:background .25s,box-shadow .25s}
.st:hover{background:#f3efe6}
.st.on{background:#fff3e6;box-shadow:inset 3px 0 0 var(--r)}
.num{flex:0 0 28px;height:28px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.st .tm{font-size:12px;font-weight:800;color:var(--r);direction:ltr;text-align:right}
.st .nm{font-weight:700;font-size:14px}.st .nt{font-size:12px;color:var(--mut)}
.lg{font-size:11.5px;color:var(--blue);padding:2px 0;margin-inline-start:44px;border-inline-start:2px dashed #b9c9da;padding-inline-start:8px}
.lg.w{color:#6b7470;border-color:#cfd5d2}
.leg-label{background:#fff;border:1px solid #b9c9da;border-radius:8px;padding:1px 5px;font-size:11px;color:var(--blue);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pin{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .25s}
.pin.hl{transform:scale(1.55);box-shadow:0 0 0 6px rgba(200,90,68,.35),0 2px 8px rgba(0,0,0,.4);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,90,68,.55)}100%{box-shadow:0 0 0 16px rgba(200,90,68,0)}}
.hp{background:#fff;color:#1d1d1d;border:1.5px solid #1d1d1d;border-radius:8px;padding:2px 7px;font-weight:800;font-size:12px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translate(-50%,-50%);display:inline-block;transition:transform .2s}
.hp.rec{background:#003b95;color:#fff;border-color:#003b95}
.hp.onsen{background:#0f8a8a;color:#fff;border-color:#0f8a8a}
.hp.hl{transform:translate(-50%,-50%) scale(1.35);z-index:1000;box-shadow:0 0 0 5px rgba(0,59,149,.3)}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.opt{padding:8px 14px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.popup h3{margin:0 0 4px;font-size:15px}.popup .tm{color:var(--r);font-weight:800}.popup a{color:var(--blue)}
.bpin{background:var(--g);color:#fff;border-radius:12px;padding:2px 8px;font-weight:700;font-size:12px;white-space:nowrap;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hc{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.hc.on{border-color:#003b95;box-shadow:0 0 0 2px rgba(0,59,149,.25)}
.hc .hn{font-weight:800;font-size:14px;direction:ltr;text-align:right}
.hc .hm{font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;border-radius:9px;padding:1px 7px;background:#eef1ee;color:#33433d}
.chip.rec{background:#003b95;color:#fff}.chip.on{background:#0f8a8a;color:#fff}.chip.best{background:#1f7a3d;color:#fff}
table.cmp{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
table.cmp td{padding:3px 4px;border-bottom:1px solid #f0ece3}
table.cmp td.p{font-weight:800;direction:ltr;text-align:left}
table.cmp tr.best td{color:#1f7a3d}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.links a{font-size:12px;color:var(--blue);text-decoration:none;border:1px solid #c9d6e3;border-radius:8px;padding:2px 7px}
.ah{font-size:14px;font-weight:800;margin:12px 0 6px;color:var(--r)}
.note{font-size:11.5px;color:var(--mut);margin:6px 0}
@media (max-width:760px){
 #app{flex-direction:column-reverse}
 #side{width:100%;max-width:none;height:52%;border-left:0;border-top:1px solid var(--line)}
 #map{height:48%;flex:0 0 48%}
 header{padding-top:10px}header h1{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.pin.hl{animation:none}}

const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'});
esri.addTo(map);
L.control.layers({'מפת רחובות':esri,'OpenStreetMap':osm,'לוויין':sat},{},{position:'topleft'}).addTo(map);
const layer = L.layerGroup().addTo(map), optLayer = L.layerGroup(), hotelLayer = L.layerGroup().addTo(map);
let stopMarkers = [], hotelMarkers = {}, curDay = -1, curStop = -1, curHotel = null;
const gm = s=>`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
const gdir = (a,b,mode)=>`https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=${mode}`;
const pinIcon = (n,c,hl)=>L.divIcon({className:'',html:`<div class="pin${hl?' hl':''}" style="background:${COL[c]||'#555'}">${n}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
const fmtMin = m=>m>=60?`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')} שע׳`:`${m} דק׳`;
const nis = v=>'₪'+Math.round(v).toLocaleString('en-US');
document.getElementById('legend').innerHTML = Object.keys(CNAME).map(k=>`<span><i style="background:${COL[k]}"></i>${CNAME[k]}</span>`).join('')+
  `<span><i style="background:#003b95;border-radius:3px"></i>מלון מומלץ</span><span><i style="background:#fff;border:1.5px solid #1d1d1d;border-radius:3px"></i>מלון</span>`;

/* ---------- hotels ---------- */
function hotelHtml(h, full){
  const rows = [['Booking', h.night]].concat(h.g?[['Google Hotels', h.g]]:[]).concat(h.ag?[['Agoda', h.ag]]:[]);
  const cmp = `<table class="cmp">${rows.map(r=>`<tr class="${r[0]===h.best?'best':''}"><td>${r[0]}${r[0]===h.best?' ✓ הכי זול':''}</td><td class="p">${nis(r[1])}</td></tr>`).join('')}<tr><td>אתר המלון</td><td class="p">לא נבדק</td></tr></table>`;
  return `<div class="hn">${h.n}</div>
   <div class="hm">${h.type==='ryokan'?'ריוקן':'מלון'} · ⭐ ${h.sc} (${h.rv.toLocaleString('en-US')} ביקורות)${h.meals?' · '+h.meals:''}</div>
   <div class="hm"><b>${nis(h.night)} ללילה לזוג</b> · ${h.nights} לילות ≈ ${nis(h.total)}</div>
   <div class="chips">${h.tag?`<span class="chip ${h.tag==='rec'?'rec':h.tag==='onsen'?'on':''}">${TAGN[h.tag]}</span>`:''}<span class="chip best">כדאי להזמין ב: ${h.best}</span></div>
   ${h.note?`<div class="note">${h.note}</div>`:''}
   ${full?cmp:''}
   <div class="links"><a target="_blank" rel="noopener" href="${h.lb}">Booking</a><a target="_blank" rel="noopener" href="${h.lg}">Google Hotels</a><a target="_blank" rel="noopener" href="${h.la}">Agoda</a><a target="_blank" rel="noopener" href="${h.lo}">אתר המלון</a><a target="_blank" rel="noopener" href="${gm(h)}">מפה</a></div>`;
}
function drawHotels(areas){
  hotelLayer.clearLayers(); hotelMarkers = {};
  if(!document.getElementById('showHotels').checked) return;
  DATA.hotels.filter(h=>!areas || areas.includes(h.a)).forEach(h=>{
    const cls = h.tag==='rec'?'rec':h.tag==='onsen'?'onsen':'';
    const m = L.marker([h.lat,h.lng],{icon:L.divIcon({className:'',html:`<div class="hp ${cls}">${nis(h.night)}</div>`,iconSize:[0,0]}),zIndexOffset:500})
      .bindPopup(`<div class="popup">${hotelHtml(h,true)}</div>`,{maxWidth:300});
    m.on('click',()=>selectHotel(h.n,false));
    m.addTo(hotelLayer); hotelMarkers[h.n] = m;
  });
}
function selectHotel(name, fly){
  curHotel = name;
  Object.entries(hotelMarkers).forEach(([n,m])=>{const el=m.getElement(); if(el){const d=el.querySelector('.hp'); d && d.classList.toggle('hl', n===name);}});
  document.querySelectorAll('.hc').forEach(el=>el.classList.toggle('on', el.dataset.n===name));
  const card = document.querySelector(`.hc[data-n="${CSS.escape(name)}"]`); if(card && !fly) card.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
  const h = DATA.hotels.find(x=>x.n===name);
  if(fly && h){ map.flyTo([h.lat,h.lng],16,FLY); setTimeout(()=>hotelMarkers[name] && hotelMarkers[name].openPopup(), reduce?0:1450); }
}
function showHotelsTab(){
  const box = document.getElementById('hinfo');
  const byArea = {}; DATA.hotels.forEach(h=>(byArea[h.a]=byArea[h.a]||[]).push(h));
  let tot = 0; Object.values(byArea).forEach(list=>{const r=list.find(x=>x.tag==='rec')||list[0]; tot += r.total;});
  let html = `<div class="dayh">מלונות לפי אזור</div><div class="daym">מחירים חיים מ-Booking / Google Hotels / Agoda (נבדקו נובמבר 2026), לזוג. כחול = המומלץ באזור. לחיצה על מלון מטיסה אליו במפה.</div>`;
  Object.keys(DATA.areas).forEach(a=>{
    if(!byArea[a]) return;
    html += `<div class="ah" data-a="${a}">${DATA.areas[a]}</div>`;
    byArea[a].sort((x,y)=>(y.tag==='rec')-(x.tag==='rec')||x.night-y.night).forEach(h=>{html += `<div class="hc" data-n="${h.n}" data-a="${a}">${hotelHtml(h,true)}</div>`;});
  });
  html += `<div class="note">המחירים הם תמונת מצב ומשתנים כל הזמן – הקישורים פותחים חיפוש חי עם התאריכים שלכם. API רשמי של Booking ניתן רק לשותפים עסקיים, ולכן אין כאן מחירים חיים בתוך המפה.</div>`;
  box.innerHTML = html;
  box.querySelectorAll('.hc').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('a')) return;
    drawHotels(null); selectHotel(el.dataset.n,true); }));
  box.querySelectorAll('.ah').forEach(el=>el.addEventListener('click',()=>{const list=DATA.hotels.filter(h=>h.a===el.dataset.a);
    drawHotels(null); map.flyToBounds(L.latLngBounds(list.map(h=>[h.lat,h.lng])),Object.assign({padding:[60,60],maxZoom:15},FLY));}));
}

/* ---------- days ---------- */
const daysEl = document.getElementById('days');
const allBtn = document.createElement('button'); allBtn.textContent='כל הטיול'; allBtn.onclick=()=>showAll(); daysEl.appendChild(allBtn);
DATA.days.forEach((d,i)=>{const b=document.createElement('button'); b.textContent=d.key; b.title=d.title; if(d.transit) b.classList.add('tr'); b.onclick=()=>showDay(i); daysEl.appendChild(b);});
function setOn(idx){[...daysEl.children].forEach((b,j)=>b.classList.toggle('on', j===idx)); const b=daysEl.children[idx]; b && b.scrollIntoView({inline:'center',block:'nearest',behavior:reduce?'auto':'smooth'});}
function showAll(){
  curDay=-1; setOn(0); layer.clearLayers(); stopMarkers=[]; drawHotels([]);
  const pts = DATA.bases.map(b=>[b.lat,b.lng]);
  L.polyline(pts,{color:'#c85a44',weight:3,dashArray:'6 6'}).addTo(layer);
  DATA.bases.forEach((b,i)=>{
    L.marker([b.lat,b.lng],{icon:L.divIcon({className:'',html:`<div class="bpin">${i+1}. ${b.n}</div>`,iconSize:null,iconAnchor:[0,10]})})
     .bindPopup(`<div class="popup"><h3>${i+1}. ${b.n}</h3><div class="tm">${b.d}</div>${b.nights} לילות</div>`).addTo(layer);});
  map.flyToBounds(L.latLngBounds(pts),Object.assign({padding:[40,40]},FLY));
  document.getElementById('info').innerHTML = `<div class="dayh">כל הטיול – ${DATA.bases.length} בסיסי לינה</div><div class="daym">33 לילות · בחרו יום למעלה כדי לראות תחנות ממוספרות שעה אחרי שעה</div>`+
    DATA.bases.map((b,i)=>`<div class="st" data-i="${i}"><div class="num" style="background:#173f38">${i+1}</div><div><div class="nm">${b.n}</div><div class="nt">${b.d} · ${b.nights} לילות</div></div></div>`).join('');
  document.querySelectorAll('#info .st').forEach(el=>el.onclick=()=>{const b=DATA.bases[+el.dataset.i]; map.flyTo([b.lat,b.lng],12,FLY);});
}
function highlightStop(j, fly){
  const d = DATA.days[curDay]; if(!d) return;
  curStop = j;
  stopMarkers.forEach((m,k)=>m.setIcon(pinIcon(k+1,d.stops[k].c,k===j)));
  document.querySelectorAll('#info .st').forEach(el=>el.classList.toggle('on', +el.dataset.j===j));
  const el = document.querySelector(`#info .st[data-j="${j}"]`); if(el && !fly) el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
  const s = d.stops[j];
  if(fly){ map.flyTo([s.lat,s.lng], Math.max(map.getZoom(),15), FLY); setTimeout(()=>stopMarkers[j] && stopMarkers[j].openPopup(), reduce?0:1450); }
}
function showDay(i){
  const d = DATA.days[i]; curDay=i; curStop=-1; setOn(i+1); layer.clearLayers(); stopMarkers=[];
  const pts = d.stops.map(s=>[s.lat,s.lng]);
  d.legs.forEach((l,j)=>{
    const a=d.stops[j], b=d.stops[j+1], walk=l.mode==='הליכה';
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:walk?'#7d8a85':'#24507a',weight:walk?3:4,dashArray:walk?'4 6':null,opacity:.85})
     .bindTooltip(`${l.icon} ${l.km} ק״מ · ~${fmtMin(l.min)}`,{permanent:d.stops.length<=9,direction:'center',className:'leg-label'}).addTo(layer);
  });
  d.stops.forEach((s,j)=>{
    const nx=d.stops[j+1];
    const dir = nx?`<br><a target="_blank" rel="noopener" href="${gdir(s,nx,d.legs[j].mode==='הליכה'?'walking':'transit')}">ניווט לתחנה ${j+2} בגוגל מפס</a>`:'';
    const m = L.marker([s.lat,s.lng],{icon:pinIcon(j+1,s.c,false),zIndexOffset:1000-j}).bindPopup(
      `<div class="popup"><h3>${j+1}. ${s.n}</h3><div class="tm">${s.t}</div>${s.note?s.note+'<br>':''}<small>${CNAME[s.c]||''}${s.en?' · '+s.en:''}</small><br><a target="_blank" rel="noopener" href="${gm(s)}">פתח בגוגל מפס</a>${dir}</div>`);
    m.on('click',()=>highlightStop(j,false));
    m.addTo(layer); stopMarkers.push(m);
  });
  drawHotels(d.areas);
  map.flyToBounds(L.latLngBounds(pts),Object.assign({padding:[50,50],maxZoom:15},FLY));
  let h = `<div class="dayh">${d.key} · ${d.title}${d.transit?'<span class="tb">יום מעבר</span>':''}</div><div class="daym">יום ${d.wd} · ${d.stops.length} תחנות · ~${d.km} ק״מ בקו אווירי</div>`;
  d.stops.forEach((s,j)=>{
    h += `<div class="st" data-j="${j}"><div class="num" style="background:${COL[s.c]}">${j+1}</div><div><div class="tm">${s.t}</div><div class="nm">${s.n}</div>${s.note?`<div class="nt">${s.note}</div>`:''}</div></div>`;
    if(d.legs[j]){const l=d.legs[j]; h += `<div class="lg ${l.mode==='הליכה'?'w':''}">${l.icon} ${l.mode} · ${l.km} ק״מ · ~${fmtMin(l.min)}</div>`;}
  });
  const hs = DATA.hotels.filter(x=>d.areas.includes(x.a));
  if(hs.length){ h += `<div class="ah">מלונות באזור הלינה (${d.areas.map(a=>DATA.areas[a]).join(' · ')})</div>`;
    hs.sort((x,y)=>(y.tag==='rec')-(x.tag==='rec')||x.night-y.night).forEach(x=>{h += `<div class="hc" data-n="${x.n}">${hotelHtml(x,false)}</div>`;}); }
  h += `<div class="note">זמני הנסיעה בין תחנות משוערים לפי מרחק; הזמנים המדויקים בלוז האולטימטיבי.</div>`;
  const info=document.getElementById('info'); info.innerHTML=h;
  info.querySelectorAll('.st').forEach(el=>el.onclick=()=>highlightStop(+el.dataset.j,true));
  info.querySelectorAll('.hc').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('a')) return; selectHotel(el.dataset.n,true);}));
  document.getElementById('scroll').scrollTop=0;
}

/* ---------- tabs / toggles ---------- */
const tDay=document.getElementById('tDay'), tHot=document.getElementById('tHot');
tDay.onclick=()=>{tDay.classList.add('on');tHot.classList.remove('on');document.getElementById('info').hidden=false;document.getElementById('hinfo').hidden=true;daysEl.hidden=false; curDay>=0?showDay(curDay):showAll();};
tHot.onclick=()=>{tHot.classList.add('on');tDay.classList.remove('on');document.getElementById('info').hidden=true;document.getElementById('hinfo').hidden=false;daysEl.hidden=true;
  layer.clearLayers(); drawHotels(null); showHotelsTab(); map.flyToBounds(L.latLngBounds(DATA.hotels.map(h=>[h.lat,h.lng])),Object.assign({padding:[40,40]},FLY));};
document.getElementById('showHotels').onchange=()=>{ if(!tHot.classList.contains('on')) { curDay>=0?drawHotels(DATA.days[curDay].areas):drawHotels([]); } else drawHotels(null); };
DATA.options.forEach(o=>L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${COL.option}">?</div>`,iconSize:[28,28],iconAnchor:[14,14]})})
  .bindPopup(`<div class="popup"><h3>${o.n}</h3><div class="tm">${o.t}</div>${o.note}<br><a target="_blank" rel="noopener" href="${gm(o)}">פתח בגוגל מפס</a></div>`).addTo(optLayer));
document.getElementById('opts').onchange=e=>{e.target.checked?optLayer.addTo(map):map.removeLayer(optLayer);};
document.addEventListener('keydown',e=>{ if(curDay<0||tHot.classList.contains('on')) return; const n=DATA.days[curDay].stops.length;
  if(e.key==='ArrowDown'){highlightStop(Math.min(n-1,curStop+1),true);e.preventDefault();} if(e.key==='ArrowUp'){highlightStop(Math.max(0,curStop-1),true);e.preventDefault();}});
showAll();
</script></body></html>
